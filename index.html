<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public Sans for NSW Government communication has moved</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="icon.svg">
  <link rel="canonical" href="https://public-sans.digital.nsw.gov.au/">
  <meta http-equiv="refresh" content="0; url=https://public-sans.digital.nsw.gov.au/">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #f6f7f9;
      color: #22272b;
    }

    main {
      width: min(100%, 36rem);
      padding: 2rem;
      background: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 0.75rem;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    a {
      color: #002664;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: .25rem;
    }
  </style>
  <script>
    (function () {
      var targetOrigin = "https://public-sans.digital.nsw.gov.au";
      var repoBasePath = "/public-sans";
      var pathname = window.location.pathname || "/";

      if (window.location.hostname.endsWith("github.io") && pathname.indexOf(repoBasePath) === 0) {
        pathname = pathname.slice(repoBasePath.length) || "/";
      }

      var destination = new URL(pathname.replace(/^\/+/, "/"), targetOrigin);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.toString());
    })();
  </script>
</head>
<body>
  <main>
    <h1>Public Sans for NSW Government communication has moved</h1>
    <p>This site now lives at <a href="https://public-sans.digital.nsw.gov.au/">public-sans.digital.nsw.gov.au</a>.</p>
    <p>If you are not redirected automatically, use the link above.</p>
  </main>
</body>
</html>
